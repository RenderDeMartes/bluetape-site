---
# Text first, bulk last: cPanel runs tasks in order and a run that stops partway
# still reports "deployment complete". Add new page folders here when gen.py grows.
# Check the LAST task landed:  curl -sI https://bluetaperigging.com/assets/css/site.css
deployment:
  tasks:
    - export DEPLOYPATH=/home/bluetaperigging/public_html/
    - /bin/cp index.html 404.html robots.txt sitemap.xml .htaccess google693ef86f823ca3aa.html $DEPLOYPATH
    - /bin/cp -R approach contact creature-rigging custom-autorig-development $DEPLOYPATH
    - /bin/cp -R facial-rigging game-character-rigging mgear-rigging rig-troubleshooting $DEPLOYPATH
    - /bin/cp -R rigging-outsourcing services unreal-engine-rigging work $DEPLOYPATH
    - /bin/cp -R assets $DEPLOYPATH
